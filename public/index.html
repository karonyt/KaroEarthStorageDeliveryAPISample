<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaroMall</title>
  <link rel="stylesheet" href="/styles.css?v=20260611-amazon">
</head>
<body>
  <div class="utility-bar">
    <div class="utility-bar-inner">
      <span class="utility-left" id="utility-store-name">aroMall</span>
      <div class="utility-right">
        <a class="utility-link" href="#">注文履歴</a>
        <a class="utility-link" href="#">ヘルプ</a>
      </div>
    </div>
  </div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="KaroMall home">
      <span class="brand-logo"><span class="brand-k">K</span><span class="brand-name">aroMall</span><span class="brand-dot">.com</span></span>
    </a>

    <form class="search" id="search-form">
      <div class="search-inner">
        <select class="search-category" id="search-category-select" aria-label="カテゴリ">
          <option value="all">すべて</option>
        </select>
        <label class="sr-only" for="search-input">検索</label>
        <input id="search-input" type="search" placeholder="商品を検索">
        <button type="submit" class="search-btn" aria-label="検索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
    </form>

    <div class="header-right">
      <div class="account-info">
        <span class="account-greeting">こんにちは</span>
        <span class="account-name" id="header-username">ゲスト</span>
      </div>
      <button class="cart-button" id="cart-toggle" type="button" aria-label="カート">
        <svg class="cart-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-label">カート</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <nav class="subnav" id="seller-tabs" aria-label="販売店"></nav>

  <main class="shell">
    <aside class="filters" aria-label="絞り込み">
      <div class="filter-block">
        <h2>カテゴリ</h2>
        <div class="filter-list" id="category-filter"></div>
      </div>
      <div class="filter-block">
        <h2>配送</h2>
        <label class="check-row"><input type="checkbox" id="filter-instant"> 即時配送あり</label>
        <label class="check-row"><input type="checkbox" id="filter-in-stock" checked> 在庫あり</label>
      </div>
      <div class="filter-block">
        <h2>並び替え</h2>
        <select id="sort-select">
          <option value="recommended">おすすめ順</option>
          <option value="stock">在庫が多い順</option>
          <option value="shipping">配送料が安い順</option>
          <option value="name">名前順</option>
        </select>
      </div>
    </aside>

    <section class="catalog">
      <nav class="breadcrumb" aria-label="パンくず">
        <a href="/">ホーム</a>
        <span class="breadcrumb-sep">/</span>
        <span id="breadcrumb-current">すべての商品</span>
      </nav>

      <div class="catalog-head">
        <div>
          <h1 id="catalog-title">すべての商品</h1>
          <p class="result-count" id="result-count"></p>
        </div>
        <div class="catalog-toolbar">
          <span id="page-range"></span>
          <label>並び替え：
            <select id="sort-select-inline">
              <option value="recommended">おすすめ順</option>
              <option value="stock">在庫が多い順</option>
              <option value="shipping">配送料が安い順</option>
              <option value="name">名前順</option>
            </select>
          </label>
          <label>表示件数
            <select id="page-size-select">
              <option value="12">12</option>
              <option value="24">24</option>
              <option value="48">48</option>
            </select>
          </label>
        </div>
      </div>

      <div class="status" id="status"></div>
      <div class="product-grid" id="product-grid"></div>
      <nav class="pagination" id="pagination" aria-label="ページ"></nav>
    </section>

    <aside class="cart-panel" id="cart-panel" aria-label="カート">
      <div class="cart-head">
        <h2>カート</h2>
        <button class="icon-button" id="cart-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <form class="checkout" id="checkout-form">
        <label>受取MCID
          <input name="recipientName" maxlength="32" autocomplete="username" required>
        </label>
        <label>受取先名
          <input name="recipientStoreName" maxlength="80" placeholder="任意">
        </label>
        <div class="checkout-breakdown">
          <span>商品合計</span>
          <strong id="item-total">0</strong>
        </div>
        <div class="checkout-breakdown">
          <span>配送料</span>
          <strong id="shipping-total">0</strong>
        </div>
        <div class="checkout-total">
          <span>合計</span>
          <strong id="order-total">0</strong>
        </div>
        <button class="primary" type="submit">注文を確定</button>
      </form>
    </aside>
  </main>

  <dialog class="product-dialog" id="product-dialog">
    <button class="icon-button dialog-close" id="dialog-close" type="button" aria-label="閉じる">×</button>
    <div id="product-dialog-content"></div>
  </dialog>

  <dialog class="order-dialog" id="order-dialog">
    <div id="order-dialog-content"></div>
    <button class="primary" id="order-dialog-close" type="button">閉じる</button>
  </dialog>

  <script src="/app.js?v=20260611-amazon" type="module"></script>
</body>
</html>
